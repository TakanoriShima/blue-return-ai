[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-return-ai"
version = "0.1.0"
description = "個人事業主の青色申告に向けた経理支援ツール（開発初期段階）"
requires-python = ">=3.12"
dependencies = [
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
